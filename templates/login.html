{% extends "base.html" %}
{% block title %}Login - Traveloop{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Sign in to continue planning your adventures.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">Sign In</button>
    </form>
    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.95rem;">
        Don't have an account? <a href="{{ url_for('auth.signup') }}" style="font-weight: 600;">Create one</a>
    </p>
</div>
{% endblock %}
