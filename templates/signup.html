{% extends "base.html" %}
{% block title %}Sign Up - Traveloop{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 560px;">
    <div class="auth-header">
        <h2>Join Traveloop</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Create your account and start exploring the world.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.signup') }}">
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="John" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input type="text" id="phone_number" name="phone_number" class="form-control" placeholder="+91 98765 43210">
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="city">City</label>
                <input type="text" id="city" name="city" class="form-control" placeholder="Mumbai">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" class="form-control" placeholder="India">
            </div>
        </div>
        
        <div class="form-group">
            <label for="bio">About You <span style="color: var(--text-muted); font-weight: 400;">(Optional)</span></label>
            <textarea id="bio" name="bio" rows="3" class="form-control" placeholder="Tell us a bit about your travel style..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">Create Account</button>
    </form>
    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.95rem;">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign in</a>
    </p>
</div>
{% endblock %}
