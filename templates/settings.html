{% extends "base.html" %}
{% block title %}Settings - Traveloop{% endblock %}

{% block content %}
<div style="max-width: 640px; margin: 0 auto;">
    <div class="breadcrumb">
        <a href="{{ url_for('trips.dashboard') }}">Dashboard</a>
        <span class="separator">/</span>
        <a href="{{ url_for('profile.user_profile') }}">Profile</a>
        <span class="separator">/</span>
        <span>Settings</span>
    </div>

    <h2 style="font-size: 2rem; margin-bottom: 2rem;">Settings</h2>

    <div class="card" style="padding: 2rem; margin-bottom: 1.5rem;">
        <h3 style="margin-bottom: 1.5rem; font-size: 1.15rem;">Profile Information</h3>
        <form method="POST">
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>First Name</label>
                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Last Name</label>
                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number or '' }}" placeholder="+91 98765 43210">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>City</label>
                    <input type="text" name="city" class="form-control" value="{{ user.city or '' }}" placeholder="Mumbai">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Country</label>
                    <input type="text" name="country" class="form-control" value="{{ user.country or '' }}" placeholder="India">
                </div>
            </div>
            
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" class="form-control" rows="4" placeholder="Tell us about your travel style...">{{ user.bio or '' }}</textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Save Changes</button>
        </form>
    </div>

    <div class="card" style="padding: 2rem; border-left: 3px solid var(--danger);">
        <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem; color: var(--danger);">Danger Zone</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Account deletion is permanent and cannot be undone.</p>
    </div>
</div>
{% endblock %}
